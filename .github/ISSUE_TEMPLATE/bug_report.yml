name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security problems go through SECURITY.md, not here. Do not attach confidential documents.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pidief --version` or the image tag
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: [CLI, HTTP API, Docker image, .NET client]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Command or request, parameters, and a minimal input file if possible
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
