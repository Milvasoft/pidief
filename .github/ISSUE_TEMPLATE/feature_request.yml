name: Feature request
description: Suggest a new operation or option
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you need to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed CLI command or API parameters
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
